<details><summary>内嵌报告快照 JSON</summary><pre id="snapshot"></pre></details><script>const decode=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));const meta=decode(document.querySelector('[data-report]').dataset.report);const put=(parent,tag,text)=>{const e=document.createElement(tag);e.textContent=text;parent.append(e);return e};put(document.querySelector('#metadata'),'p','来源审计：'+meta.auditId+'；源报告'+(meta.complete?'完整':'不完整')+'；此只读快照覆盖 '+meta.includedPairs+' / '+meta.totalPairs+' 对证据。');if(meta.truncated)put(document.querySelector('#metadata'),'p','已达到输出大小上限；省略 '+meta.omittedPairs+' 对证据。').className='warning';if(meta.reportTruncated)put(document.querySelector('#metadata'),'p','报告 JSON 已按大小上限裁剪；配对详情保留在下方证据中，请另行保留完整源报告。').className='warning';const snapshot={...meta,evidence:[]};for(const el of document.querySelectorAll('[data-evidence]')){const row=decode(el.dataset.evidence);snapshot.evidence.push(row);put(el,'h2',row.pair.evidence+(row.pair.matchOrb?' · 几何内点 '+row.pair.matchOrb.inliers+'（候选，非概率）':' · 距离 '+row.pair.distance));put(el,'p',row.left.path+' ↔ '+row.right.path);for(const value of [row.leftThumbnail,row.rightThumbnail]){if(value){const img=document.createElement('img');img.src=value;img.alt='配对图像缩略图';el.append(img)}else put(el,'p','缩略图不可用')}put(el,'p','人工复核：'+(row.review?.decision||'未复核')+(row.review?.note?'；'+row.review.note:''));const details=document.createElement('details');put(details,'summary','查看原始证据');put(details,'pre',JSON.stringify({pair:row.pair,left:row.left,right:row.right,review:row.review},null,2));el.append(details)}document.querySelector('#snapshot').textContent=JSON.stringify(snapshot,null,2);</script></body></html>
